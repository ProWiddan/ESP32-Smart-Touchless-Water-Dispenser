; Optional PlatformIO configuration
; https://docs.platformio.org/
;
; Arduino IDE users can ignore this file and open water_dispenser.ino directly.
;
; PlatformIO note: copy or symlink the sketch to src/main.cpp, e.g.
;   mkdir -p src && cp water_dispenser.ino src/main.cpp

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

build_src_filter =
    +<*>
    +<../water_dispenser.ino>

; If build_src_filter does not pick up the root .ino on your PIO version,
; use: cp water_dispenser.ino src/main.cpp
